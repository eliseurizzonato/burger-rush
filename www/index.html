<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fdcff">
<title>Burger Rush</title>
<style>
  @font-face{font-family:'Fredoka';font-weight:500;font-display:swap;src:url(vendor/fredoka-500.woff2) format('woff2')}
  @font-face{font-family:'Fredoka';font-weight:700;font-display:swap;src:url(vendor/fredoka-700.woff2) format('woff2')}
  :root{--ink:#2b2140;--green:#2fbf4a;--green-d:#1c8a31}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fdcff;font-family:'Fredoka',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  .ui{position:fixed;z-index:2}
  #cash{top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);padding:4px 20px 4px 6px;border-radius:999px;font-weight:700;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.18);pointer-events:none}
  #cash.pulse{animation:pl .22s}
  @keyframes pl{50%{transform:translateX(-50%) scale(1.12)}}
  .coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#ffc928 45%,#e09a00);border:2px solid #c98400;box-sizing:border-box}
  #prog{top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:230px;text-align:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 2px #0008;pointer-events:none}
  #prog .bar{height:9px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden;margin-top:3px}
  #prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9cf08b,var(--green));border-radius:9px;transition:width .4s}
  .round{width:50px;height:50px;border-radius:16px;border:0;background:#fff;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center;padding:0}
  .round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #btnMute{right:12px;top:calc(12px + env(safe-area-inset-top))}
  .side{right:14px;width:66px;height:66px;border-radius:20px;font:700 11px 'Fredoka',system-ui;color:var(--ink);line-height:1}
  .side b{font-size:26px;display:block;margin-bottom:2px}
  #btnUp{bottom:calc(20px + env(safe-area-inset-bottom));background:#ffcf33}
  #btnMis{bottom:calc(98px + env(safe-area-inset-bottom));background:#8fd8ff}
  #btnRest{bottom:calc(176px + env(safe-area-inset-bottom));background:#ffb3c7}
  .badge{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ff3b3b;border:3px solid #fff;display:none}
  #toast{top:calc(100px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);background:#fff;color:var(--ink);font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.15);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #tut{left:0;right:0;bottom:18%;text-align:center;color:#fff;font-weight:700;font-size:26px;text-shadow:0 3px 0 #0006;pointer-events:none;display:none}
  #tut .hand{font-size:56px;display:inline-block;animation:sw 1.2s ease-in-out infinite}
  @keyframes sw{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
  #joy{width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);display:none;pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  #fade{position:fixed;inset:0;z-index:9;background:#2b2140;opacity:0;pointer-events:none;transition:opacity .35s;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700}
  #fade.on{opacity:1;pointer-events:auto}
  .modal{position:fixed;inset:0;z-index:5;background:rgba(30,20,60,.55);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .card{background:#fff8ec;color:var(--ink);border-radius:24px;padding:18px;width:min(390px,100%);box-sizing:border-box;box-shadow:0 8px 0 rgba(0,0,0,.2);max-height:88vh;overflow:auto;text-align:center;animation:pop .25s cubic-bezier(.3,1.6,.6,1)}
  @keyframes pop{from{transform:scale(.7)}}
  .card h2{margin:0 0 6px;font-size:26px}
  .card p{margin:0 0 8px;color:#6d6280}
  .up{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;margin:8px 0;box-shadow:0 2px 0 rgba(0,0,0,.08);text-align:left}
  .up .ic{font-size:28px;width:46px;height:46px;flex:none;display:grid;place-items:center;background:#ffefc2;border-radius:12px}
  .up .tx{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .up small{color:#8a7f99}
  .up span{font-size:13px}
  .up .here{font-size:13px;font-weight:700;color:var(--green-d);flex:none}
  .mbar{height:8px;background:#eee4f5;border-radius:8px;overflow:hidden;margin:4px 0 2px}
  .mbar i{display:block;height:100%;background:linear-gradient(90deg,#9cf08b,var(--green));border-radius:8px}
  .row{display:flex;justify-content:space-between;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:16px}
  .btn{font:700 17px 'Fredoka',system-ui;color:#fff;background:var(--green);border:0;border-bottom:4px solid var(--green-d);border-radius:12px;padding:8px 12px;cursor:pointer;min-width:74px;flex:none}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .btn:disabled{background:#c9c1d3;border-bottom-color:#a69db2;cursor:default;transform:none}
  .btn.big{font-size:22px;padding:12px 36px;margin-top:8px}
  .big-num{font-size:40px;font-weight:700;color:#e09a00;margin:6px 0}
  .link{display:inline-block;margin-top:12px;color:#a397b3;font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
</style>
<script src="vendor/capacitor.js"></script>
<script src="vendor/three.min.js"></script>
</head>
<body>
<div id="cash" class="ui"><div class="coin"></div><span id="money">0</span></div>
<div id="prog" class="ui"><div id="progTxt"></div><div class="bar"><i id="progBar"></i></div></div>
<div id="toast" class="ui"></div>
<button id="btnMute" class="ui round" aria-label="Som">🔊</button>
<button id="btnRest" class="ui round side" aria-label="Restaurantes"><span><b>🏪</b>Lojas</span><i class="badge" id="bRest"></i></button>
<button id="btnMis" class="ui round side" aria-label="Missões"><span><b>📋</b>Missões</span><i class="badge" id="bMis"></i></button>
<button id="btnUp" class="ui round side" aria-label="Melhorias"><span><b>⬆</b>Melhorias</span><i class="badge" id="bUp"></i></button>
<div id="tut" class="ui"><div class="hand">👆</div><div>ARRASTE PARA MOVER</div></div>
<div id="joy" class="ui"><div id="knob"></div></div>
<div id="panel" class="modal"><div class="card"><h2>Melhorias</h2><p id="upSub">Valem só para este restaurante</p><div id="ups"></div><div class="up" id="cloudRow"></div><button class="btn big" data-close>Fechar</button><br><button class="link" id="reset">Recomeçar do zero</button></div></div>
<div id="missions" class="modal"><div class="card"><h2>Missões do dia</h2><p id="mSub"></p><div id="mList"></div><button class="btn big" data-close>Fechar</button></div></div>
<div id="rests" class="modal"><div class="card"><h2>Seus restaurantes</h2><p id="rSub"></p><div id="rList"></div><button class="btn big" data-close>Fechar</button></div></div>
<div id="welcome" class="modal"><div class="card"><h2>Bem-vindo de volta!</h2><div id="wRows"></div><div class="big-num">+<span id="offAmt">0</span></div><button class="btn big" id="collect">Coletar</button></div></div>
<div id="cloudPick" class="modal"><div class="card"><h2>☁️ Progresso na nuvem</h2><p>Achamos um progresso maior salvo na sua conta.</p><div class="row" style="flex-direction:column;text-align:left" id="cpTxt"></div><button class="btn big" id="cpLoad">Carregar da nuvem</button><br><button class="link" id="cpKeep">Manter o deste aparelho</button></div></div>
<div id="fade"></div>
<script>
'use strict';
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const AUTO = Q.has('auto'), FRESH = AUTO || Q.has('fresh');
const memo = f => { const c = new Map(); return k => { if (!c.has(k)) c.set(k, f(k)); return c.get(k); }; };
const fmt = n => n < 10000 ? String(Math.floor(n)) : n < 1e6 ? (n / 1000).toFixed(n < 100000 ? 1 : 0) + 'k' : (n / 1e6).toFixed(1) + 'M';

// ---------- progresso salvo ----------
const SAVE_KEY = 'burger-rush-save-v1';
function loadSave() { if (FRESH) return null; try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
// formato do save: ao mudar, suba SAVE_VERSION e acrescente um passo em MIGRATIONS (nunca apague os antigos)
const SAVE_VERSION = 2;
const MIGRATIONS = {
  1: s => { if (!s.r) { s.r = [{bought: s.bought || [], lv: s.lv || {}, rate: 0}]; delete s.bought; delete s.lv; } }, // 1 restaurante -> vários
};
function migrate(s) { s.v = s.v || 1; while (s.v < SAVE_VERSION) { if (MIGRATIONS[s.v]) MIGRATIONS[s.v](s); s.v++; } return s; }
const S = migrate(Object.assign({money: 0, muted: false, last: Date.now(), tut: false, cur: 0, r: null, streak: 0, lastLogin: '', daily: null, has: {}}, loadSave() || {}));
const LV0 = {cap: 0, speed: 0, price: 0, grill: 0};
for (const r of S.r) if (r) r.lv = Object.assign({}, LV0, r.lv);
if (!S.r[S.cur]) S.cur = 0;
const R = S.r[S.cur];
const firstRun = !S.tut;
let dirty = false, lockSave = false;
function persist() { if (FRESH || lockSave) return; S.last = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
setInterval(() => { if (dirty) { dirty = false; persist(); } }, 2000);
addEventListener('pagehide', persist);

// cada restaurante tem tema próprio; preços e valor dos lanches crescem
const RESTS = [
  {name: 'Lanchonete da Praça', icon: '🍔', mult: 1, val: 1, cost: 0, floor: ['#f8e6c4', '#efd3a3'], kitchen: ['#e8f0f4', '#d3e0e8'], wall: 0xfbe7c6, trim: 0xd9573b, ground: 0x8fd16a, sky: 0x9fdcff, tree: 'pine'},
  {name: 'Quiosque da Praia', icon: '🏖️', mult: 6, val: 4, cost: 3000, floor: ['#fff3d6', '#ffe1a1'], kitchen: ['#e3f6f5', '#c4ebe8'], wall: 0xc4ecf3, trim: 0x2a9fb8, ground: 0xf2dc9b, sky: 0x8fe3ff, tree: 'palm'},
  {name: 'Praça de Alimentação', icon: '🏬', mult: 36, val: 16, cost: 60000, floor: ['#efeaf6', '#dcd3ee'], kitchen: ['#eef0f3', '#dde2e8'], wall: 0xf1e2f6, trim: 0x7b4fd8, ground: 0xb7bec7, sky: 0xc9d6ff, tree: 'round'},
];
const T = RESTS[S.cur];
const PRODUCTS = {
  burger: {icon: '🍔', name: 'hambúrguer', base: 10, time: 1.1},
  fries: {icon: '🍟', name: 'batata', base: 14, time: 1.5},
  soda: {icon: '🥤', name: 'refri', base: 8, time: .9},
};
const cap = () => 5 + R.lv.cap;
const speed = () => 5.5 * (1 + .1 * R.lv.speed);
const value = type => PRODUCTS[type].base * T.val * (1 + .3 * R.lv.price);
const prepTime = (type, l) => PRODUCTS[type].time * Math.pow(.88, l);

// ---------- cena ----------
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(T.sky);
document.body.style.background = '#' + T.sky.toString(16).padStart(6, '0');
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const CAM_OFF = new V3(10, 13, 10);
function resize() {
  const a = innerWidth / innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  const halfH = a < 1 ? 5.2 / a : 6.5;
  cam.left = -halfH * a; cam.right = halfH * a; cam.top = halfH; cam.bottom = -halfH;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0xa08c70, 0.6));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.65);
sun.position.set(-6, 16, 8); sun.target.position.set(0, 0, 3);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, {left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 50});
scene.add(sun, sun.target);

// sombreamento em 3 faixas (visual de desenho animado)
const grad = new THREE.DataTexture(new Uint8Array([110, 110, 110, 255, 190, 190, 190, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const mat = memo(c => new THREE.MeshToonMaterial({color: c, gradientMap: grad}));
const basic = memo(c => new THREE.MeshBasicMaterial({color: c}));
function mesh(geo, c, shadow = true) { const m = new THREE.Mesh(geo, typeof c === 'number' ? mat(c) : c); m.castShadow = shadow; m.receiveShadow = true; return m; }
const box = (w, h, d, c) => mesh(new THREE.BoxGeometry(w, h, d), c);
const cyl = (r, h, c, s = 18, r2 = r) => mesh(new THREE.CylinderGeometry(r, r2, h, s), c);
const ball = (r, c) => mesh(new THREE.SphereGeometry(r, 18, 12), c);
const at = (o, x, y, z, parent = scene) => { o.position.set(x, y, z); parent.add(o); return o; };

function canvasTex(w, h, draw, rep) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  t.anisotropy = 4; return t;
}
const tiles = ([c1, c2], line) => (g, w, h) => {
  g.fillStyle = c1; g.fillRect(0, 0, w, h); g.fillStyle = c2; g.fillRect(0, 0, w / 2, h / 2); g.fillRect(w / 2, h / 2, w / 2, h / 2);
  g.strokeStyle = line; g.lineWidth = 2; g.strokeRect(0, 0, w / 2, h / 2); g.strokeRect(w / 2, h / 2, w / 2, h / 2); g.strokeRect(w / 2, 0, w / 2, h / 2); g.strokeRect(0, h / 2, w / 2, h / 2);
};
function plane(w, d, m, x, z, y = 0) { const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m); p.rotation.x = -Math.PI / 2; p.position.set(x, y, z); p.receiveShadow = true; scene.add(p); return p; }

// ---------- cenário ----------
plane(120, 120, mat(T.ground), 0, 0, -0.03);
plane(80, 3.2, mat(0x5d6470), 0, 17.6, -0.02);
for (let x = -38; x < 40; x += 3) plane(1.4, .18, basic(0xf6f1de), x, 17.6, -0.01);
plane(2.6, 3, mat(0xd8d2c4), 0, 14.6, -0.015);
plane(14, 14, new THREE.MeshToonMaterial({gradientMap: grad, map: canvasTex(64, 64, tiles(T.floor, 'rgba(0,0,0,.05)'), [7, 7])}), 0, 6);
plane(14, 6, new THREE.MeshToonMaterial({gradientMap: grad, map: canvasTex(64, 64, tiles(T.kitchen, 'rgba(0,0,0,.06)'), [7, 3])}), 0, -4, 0.002);
plane(1.6, 1, mat(T.trim), 0, 12.6, 0.004);

// paredes do fundo (as da frente são baixas para não tapar a câmera)
at(box(14.6, 2.8, .3, T.wall), 0, 1.4, -7.15); at(box(14.6, .7, .34, T.trim), 0, .35, -7.13);
at(box(.3, 2.8, 20.3, T.wall), -7.15, 1.4, 3); at(box(.34, .7, 20.3, T.trim), -7.13, .35, 3);
at(box(.3, .5, 20.3, T.trim), 7.15, .25, 3);
at(box(5.7, .5, .3, T.trim), -4.3, .25, 13.15); at(box(5.7, .5, .3, T.trim), 4.3, .25, 13.15);
for (const z of [1.5, 5.5, 9.5]) {
  at(box(.12, 1.3, 1.9, 0xffffff), -7.02, 1.6, z);
  at(mesh(new THREE.BoxGeometry(.1, 1.1, 1.7), basic(0xbfe8ff), false), -6.98, 1.6, z);
  at(box(.14, .08, 1.7, 0xffffff), -6.96, 1.6, z);
}
const menuTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#2f4a3a'; g.fillRect(0, 0, w, h); g.strokeStyle = '#b5793f'; g.lineWidth = 18; g.strokeRect(0, 0, w, h);
  g.fillStyle = '#ffe9a8'; g.font = '700 64px Fredoka, system-ui'; g.textAlign = 'center'; g.fillText('BURGER RUSH', w / 2, 100);
  g.font = '80px system-ui'; g.fillText('🍔 🍟 🥤', w / 2, 200);
});
at(new THREE.Mesh(new THREE.PlaneGeometry(3, 1.5), new THREE.MeshBasicMaterial({map: menuTex})), 3, 1.75, -6.98);

const fridge = at(new THREE.Group(), 6.1, 0, -6.3);
at(box(1.3, 2.2, 1, 0xf2f6f8), 0, 1.1, 0, fridge); at(box(1.32, .04, 1.02, 0xc5d0d8), 0, 1.4, 0, fridge);
at(box(.06, .5, .06, 0x9aa7b0), -.45, 1.75, .52, fridge); at(box(.06, .5, .06, 0x9aa7b0), -.45, .9, .52, fridge);

function plant(x, z, s = 1) {
  const g = at(new THREE.Group(), x, 0, z);
  at(cyl(.32 * s, .5 * s, 0xc96f3b, 14, .24 * s), 0, .25 * s, 0, g);
  at(ball(.45 * s, 0x4fb04a), 0, .8 * s, 0, g); at(ball(.3 * s, 0x63c45a), .22 * s, 1.05 * s, .1 * s, g);
}
plant(-6.4, 12.4); plant(6.4, 12.4); plant(-6.4, -.4, .8);
function tree(x, z, s) {
  const g = at(new THREE.Group(), x, 0, z);
  if (T.tree === 'palm') {
    for (let i = 0; i < 4; i++) at(cyl(.16 * s, .7 * s, 0x9b7247, 8, .2 * s), i * .08 * s, .35 * s + i * .68 * s, 0, g).rotation.z = -.08;
    for (let i = 0; i < 6; i++) { const l = at(box(1.5 * s, .05, .35 * s, i % 2 ? 0x3fae4f : 0x56c25e), .3 * s, 2.8 * s, 0, g); l.rotation.set(0, i * Math.PI / 3, -.35); l.geometry.translate(.7 * s, 0, 0); }
    at(ball(.12 * s, 0x7a5230), .4 * s, 2.7 * s, .1 * s, g);
  } else if (T.tree === 'round') {
    at(box(1 * s, .5 * s, 1 * s, 0x8a8f99), 0, .25 * s, 0, g);
    at(cyl(.12 * s, .9 * s, 0x8a5a33), 0, .9 * s, 0, g); at(ball(.75 * s, 0x5cb85c), 0, 1.7 * s, 0, g);
  } else {
    at(cyl(.18 * s, 1 * s, 0x8a5a33), 0, .5 * s, 0, g);
    at(mesh(new THREE.ConeGeometry(1 * s, 1.6 * s, 8), 0x3f9e4a), 0, 1.6 * s, 0, g);
    at(mesh(new THREE.ConeGeometry(.75 * s, 1.3 * s, 8), 0x52b55a), 0, 2.4 * s, 0, g);
  }
}
let seed = 7 + S.cur * 13; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 70; i++) {
  const x = rnd() * 50 - 25, z = rnd() * 50 - 20;
  if ((x > -9 && x < 9 && z > -9 && z < 15.5) || (z > 15 && z < 20.5)) continue;
  tree(x, z, .8 + rnd() * .6);
}

// ---------- textos em sprite ----------
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function label(text, {w = 256, h = 96, font = '700 54px Fredoka, system-ui, sans-serif', fg = '#fff', bg = 'rgba(0,0,0,.55)', scale = 1.6} = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, depthTest: false, transparent: true}));
  sp.scale.set(scale, scale * h / w, 1); sp.renderOrder = 10;
  sp.set = (t, bgc = bg, fgc = fg) => {
    if (t === sp._t && bgc === sp._bg) return; sp._t = t; sp._bg = bgc;
    g.clearRect(0, 0, w, h);
    if (bgc) { g.fillStyle = 'rgba(0,0,0,.18)'; roundRect(g, 4, 10, w - 8, h - 14, (h - 14) / 2); g.fill(); g.fillStyle = bgc; roundRect(g, 4, 4, w - 8, h - 14, (h - 14) / 2); g.fill(); }
    g.fillStyle = fgc; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, w / 2, h / 2 - (bgc ? 2 : 0));

const queue = [], customers = [];

function makeOrder() {

  const c = makeChar({shirt: pick(SHIRTS), skin: pick(SKINS), pants: pick([0x2d3142, 0x3c5a99, 0x6b4a2a])});
  c.g.position.set((Math.random() - .5) * 2, 0, 15); c.order = makeOrder(); c.got = {}; c.state = 'queue'; c.t = 0; c.pay = 0; c.payT = 0;

const orderText = c => Object.entries(c.order).filter(([k, n]) => c.got[k] < n).map(([k, n]) => PRODUCTS[k].icon + (n - c.got[k])).join(' ');
function updateCustomer(c, dt) {
  if (c.pay > 0 && (c.payT -= dt) <= 0) {
    c.payT = .05; c.pay--;
    const b = makeBill(c.billVal); b.mesh.position.copy(c.g.position).add(new V3(0, 1, 0)); scene.add(b.mesh);
    moneyPile.items.push(b); const idx = moneyPile.items.length - 1;
    fly(b, () => moneyPile.group.localToWorld(moneyPile.slot(idx)), () => { moneyPile.group.add(b.mesh); b.mesh.position.copy(moneyPile.slot(idx)); b.mesh.rotation.set(0, 0, 0); b.arrived = true; }, .3);
  }
  if (c.state === 'queue') {
    const i = queue.indexOf(c);
    const there = moveTo(c, 0, .9 + i * 1.15, 3, dt);

    if (i === 0 && there) {
      c.bubble.visible = true; c.bubble.set(orderText(c) || '👍');
      if ((c.t -= dt) <= 0) for (const [k, n] of Object.entries(c.order)) if (c.got[k] < n && transfer(counters[k], c.hand)) { c.got[k]++; c.t = .28; break; }

        queue.shift(); c.bubble.visible = false;
        let total = 0, items = 0;
        for (const [k, n] of Object.entries(c.order)) { total += n * value(k); items += n; track(k, n); }
        track('serve', 1);
        c.pay = Math.min(15, items * 3); c.billVal = total / c.pay;
        if (Math.hypot(player.g.position.x - c.g.position.x, player.g.position.z - c.g.position.z) < 9) sfx.pay();
        const free = seats.filter(s => !s.taken), seat = free[Math.random() * free.length | 0];
        if (seat) { seat.taken = true; c.seat = seat; c.state = 'toSeat'; }
        else { c.state = 'leave'; c.bubble.set('😠 Sem lugar', 'rgba(230,60,60,.95)', '#fff'); c.bubble.visible = true; c.t = 1.6; }
      }
    }
  } else if (c.state === 'toSeat') {
    if (moveTo(c, c.seat.x, c.seat.z, 3, dt)) {
      c.state = 'eat'; c.t = 5; c.sitting = true; c.g.position.y = .12; c.g.rotation.y = c.seat.side > 0 ? -Math.PI / 2 : Math.PI / 2;

      c.bubble.set('😋'); c.bubble.visible = true;
    }

    c.t -= dt; c.food.forEach(it => it.mesh.scale.setScalar(Math.max(.01, Math.min(1, c.t / 4))));
    if (c.t <= 0) {
      c.food.forEach(it => drop(it.mesh)); c.seat.taken = false; c.sitting = false; c.g.position.y = 0; c.state = 'leave'; c.t = 1.2;
      c.bubble.set('❤️'); c.bubble.visible = true;
    }
  } else if (c.state === 'leave') {
    if ((c.t -= dt) <= 0) c.bubble.visible = false;
    if (moveTo(c, c.g.position.x < 0 ? -1.2 : 1.2, 15.5, 3, dt) && c.pay === 0) { scene.remove(c.g); customers.splice(customers.indexOf(c), 1); }
  }
  animChar(c, dt);
}

// ---------- missões diárias e bônus de sequência ----------
const dayKey = (t = Date.now()) => new Date(t).toLocaleDateString('sv-SE'); // AAAA-MM-DD no fuso local
const MPOOL = [
  {k: 'serve', icon: '🙋', t: n => `Atenda ${n} clientes`, n: [12, 25, 45]},
  {k: 'burger', icon: '🍔', t: n => `Venda ${n} hambúrgueres`, n: [20, 40, 70]},
  {k: 'fries', icon: '🍟', t: n => `Venda ${n} batatas`, n: [8, 18, 32], need: 'fries'},
  {k: 'soda', icon: '🥤', t: n => `Venda ${n} refris`, n: [8, 18, 32], need: 'soda'},
  {k: 'earn', icon: '💰', t: n => `Ganhe $${fmt(n)}`, n: [300, 800, 1800], scale: true},
  {k: 'upgrade', icon: '⬆️', t: n => `Compre ${n} melhoria${n > 1 ? 's' : ''}`, n: [1, 2, 3]},
];
const bestVal = () => Math.max(...S.r.map((r, i) => (r ? RESTS[i].val : 1)));
function ensureDaily() {
  const today = dayKey();
  if (S.daily && S.daily.day === today) return false;
  let h = 0; for (const ch of today) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const r = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const pool = MPOOL.filter(m => !m.need || S.has[m.need]), used = new Set(), list = [], v = bestVal();
  for (let tier = 0; tier < 3; tier++) {
    let m, guard = 0;
    do { m = pool[Math.floor(r() * pool.length)]; } while (used.has(m.k) && guard++ < 30);
    used.add(m.k);
    list.push({k: m.k, n: Math.round(m.n[tier] * (m.scale ? v : 1)), p: 0, reward: Math.round([60, 150, 320][tier] * v), claimed: false});
  }
  S.daily = {day: today, list}; dirty = true; return true;
}
function track(k, a) {
  if (!S.daily) return;
  for (const m of S.daily.list) if (m.k === k && !m.claimed && m.p < m.n) {
    m.p = Math.min(m.n, m.p + a); dirty = true;
    if (m.p >= m.n) { toast('✅ Missão concluída! Resgate em Missões'); sfx.done(); }
  }
  if ($('missions').classList.contains('open') && k !== 'earn') renderMissions();
  refreshBadges();
}
function untilMidnight() { const d = new Date(), m = new Date(d); m.setHours(24, 0, 0, 0); const s = (m - d) / 1000; return `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}min`; }

  $('mSub').textContent = (all ? 'Tudo feito! ' : '') + `Novas missões em ${untilMidnight()} · Sequência: ${S.streak || 1} dia${S.streak > 1 ? 's' : ''} 🔥`;

    return `<div class="up"><div class="ic">${def.icon}</div><div class="tx"><b>${def.t(m.n)}</b><div class="mbar"><i style="width:${m.p / m.n * 100}%"></i></div><small>${fmt(m.p)} / ${fmt(m.n)}</small></div>${m.claimed ? '<span class="here">✓ Feito</span>' : `<button class="btn" data-claim="${i}" ${done ? '' : 'disabled'}>$${fmt(m.reward)}</button>`}</div>`;

const progressOf = s => (s && s.r ? s.r.reduce((a, r, i) => a + (r ? i * 100 + r.bought.length * 5 + Object.values(r.lv || {}).reduce((x, y) => x + y, 0) : 0), 0) : 0);

const Cloud = (() => {
  const C = window.Capacitor, SLOT = 'burger-rush-main';
  const P = C && C.isNativePlatform && C.isNativePlatform() && C.registerPlugin ? C.registerPlugin('PlayGamesSaves') : null;
  const st = {available: !!P, signedIn: false, name: '', busy: false, lastPush: 0, pending: null};
  async function signIn(interactive) {
    try { const r = await P.signIn({interactive}); st.signedIn = !!r.signedIn; st.name = r.name || ''; } catch (e) { st.signedIn = false; }
    renderCloud(); return st.signedIn;
  }
  async function write(data, desc, progress) { await P.save({name: SLOT, data: JSON.stringify(data), description: desc, progress: Math.round(progress)}); st.lastPush = Date.now(); }
  async function push(force) {
    if (!st.signedIn || st.busy || FRESH || (!force && Date.now() - st.lastPush < 60000)) return;
    st.busy = true; S.last = Date.now();
    try { await write(S, describe(S), progressOf(S)); } catch (e) {}
    st.busy = false; renderCloud();
  }
  // decide qual progresso vale: o com mais avanço; aparelho novo carrega direto, senão pergunta
  async function reconcile() {
    let remote = null;
    try { const r = await P.load({name: SLOT}); remote = r && r.data ? JSON.parse(r.data) : null; } catch (e) {}
    if (!remote || !remote.r) return push(true);
    if ((remote.v || 1) > SAVE_VERSION) { toast('☁️ Seu save na nuvem é de uma versão mais nova. Atualize o app!'); return; }
    const pr = progressOf(migrate(remote)), pl = progressOf(S);
    if (pr <= pl) return push(true);
    if (pl < 5) return adopt(remote);
    st.pending = remote;
    $('cpTxt').innerHTML = `<span><b>Nuvem:</b> ${describe(remote)}</span><span><b>Este aparelho:</b> ${describe(S)}</span>`;
    openModal('cloudPick');
  }
  function adopt(remote) {
    lockSave = true;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(remote)); } catch (e) {}
    $('fade').textContent = '☁️ Carregando seu progresso...'; $('fade').classList.add('on');
    setTimeout(() => location.reload(), 500);
  }
  async function start() {
    renderCloud();
    if (!P || FRESH) return;
    if (await signIn(false)) await reconcile();
    setInterval(() => push(false), 180000);
  }
  async function wipe() { if (st.signedIn) try { await write({v: SAVE_VERSION, money: 0, r: [{bought: [], lv: {}, rate: 0}]}, 'Novo jogo', 0); } catch (e) {} }
  return {st, start, push, wipe, adopt, signInAndSync: async () => { if (await signIn(true)) await reconcile(); }};
})();
function renderCloud() {

  if (!st.available) sub = 'Disponível no app Android';

  else {

    const b = $('ups').querySelector(`[data-k="${u.k}"]`); if (b) b.disabled = !ok;
  }
  $('bUp').style.display = up ? 'block' : 'none';
  $('bMis').style.display = S.daily && S.daily.list.some(m => !m.claimed && m.p >= m.n) ? 'block' : 'none';
  const nxt = S.r.length;
  $('bRest').style.display = RESTS[nxt] && complete(S.r[nxt - 1]) && S.money >= RESTS[nxt].cost ? 'block' : 'none';
}
const openModal = id => { $(id).classList.add('open'); release(); };
const closeModal = id => $(id).classList.remove('open');
$('btnUp').addEventListener('click', () => { initAudio(); renderUps(); openModal('panel'); });
$('btnMis').addEventListener('click', () => { initAudio(); renderMissions(); openModal('missions'); });
$('btnRest').addEventListener('click', () => { initAudio(); R.rate = currentRate(); renderRests(); openModal('rests'); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.closest('.modal').id)));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m && m.id !== 'welcome' && m.id !== 'cloudPick') closeModal(m.id); }));
$('btnMute').addEventListener('click', () => { initAudio(); setMuted(!S.muted); });
$('reset').addEventListener('click', async () => {
  if (!confirm('Apagar todo o progresso (todos os restaurantes, inclusive na nuvem) e começar de novo?')) return;
  lockSave = true;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  await Cloud.wipe(); location.reload();
});

function offlineEarn(ms) {
  R.rate = currentRate();
  const minutes = Math.min(ms / 60000, 60);
  return Math.floor(minutes * S.r.reduce((a, r) => a + (r ? r.rate : 0), 0));
}
let pendingGift = 0;
function showWelcome(offline, bonus) {
  if (offline < 5 && bonus <= 0) return;
  const rows = [];
  if (offline >= 5) rows.push(`<div class="row"><span>🕒 Faturou enquanto você estava fora</span><b>$${fmt(offline)}</b></div>`);
  if (bonus > 0) rows.push(`<div class="row"><span>🔥 Bônus diário · dia ${S.streak}</span><b>$${fmt(bonus)}</b></div>`);
  pendingGift += Math.max(0, offline >= 5 ? offline : 0) + bonus;
  $('wRows').innerHTML = rows.join(''); $('offAmt').textContent = '$' + fmt(pendingGift); openModal('welcome');
}
$('collect').addEventListener('click', () => {
  initAudio(); closeModal('welcome'); addMoney(pendingGift); pendingGift = 0; sfx.buy();
  burst(player.g.position.clone().add(new V3(0, 1.2, 0)), 30, COINS, {speed: 3.5, up: 7, size: .16});
});
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); R.rate = currentRate(); persist(); Cloud.push(true); }
  else if (hiddenAt) {
    const away = Date.now() - hiddenAt; hiddenAt = 0; last = performance.now();
    if (ensureDaily()) toast('📋 Novas missões do dia!');
    showWelcome(FRESH || away < 60000 ? 0 : offlineEarn(away), loginBonus());
  }
});

// ---------- entrada (joystick + teclado) ----------
const input = {x: 0, y: 0}; let drag = null, started = !firstRun;
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; firstTouch(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function firstTouch() { initAudio(); if (!started) { started = true; $('tut').style.display = 'none'; } }
if (!started && !AUTO) $('tut').style.display = 'block';
addEventListener('pointerdown', e => {
  if (e.target.closest('button, .modal')) return;
  firstTouch(); drag = {x: e.clientX, y: e.clientY};
  Object.assign($('joy').style, {display: 'block', left: e.clientX + 'px', top: e.clientY + 'px'}); $('knob').style.transform = '';
});
addEventListener('pointermove', e => {
  if (!drag) return;
  let dx = e.clientX - drag.x, dy = e.clientY - drag.y; const d = Math.hypot(dx, dy), Rj = 50;
  if (d > Rj) { dx *= Rj / d; dy *= Rj / d; }
  input.x = dx / Rj; input.y = dy / Rj; $('knob').style.transform = `translate(${dx}px,${dy}px)`;
});
function release() { drag = null; input.x = input.y = 0; $('joy').style.display = 'none'; }
addEventListener('pointerup', release); addEventListener('pointercancel', release);

// modo demonstração (?auto=1): um robô joga sozinho, útil para testar o ciclo inteiro
function autoTarget() {
  const nz = ZONES.find(z => z.g.visible && !bought.has(z.id)), hand = player.hand, any = stations.some(s => s.stack.count);
  if (nz && S.money >= nz.left) return new V3(nz.x, 0, nz.z);
  if (moneyPile.count >= 10 || (moneyPile.count && !hand.count)) return PILE;
  if (hand.top && counters[hand.top.type].count < COUNTER_MAX && (hand.count >= cap() || !any)) return new V3(SECTIONS[hand.top.type], 0, -2.2);
  if (hand.count >= cap()) return PILE;
  if (S.money > 0 && nz && !hand.count && !any) return new V3(nz.x, 0, nz.z);
  const usable = stations.filter(s => counters[s.type].count < COUNTER_MAX);
  if (!usable.length) return PILE;
  const s = usable.reduce((a, b) => (b.stack.count - counters[b.type].count > a.stack.count - counters[a.type].count ? b : a));
  return s.front;
}

// ---------- seta-guia (só na primeira vez) ----------
const arrow = at(mesh(new THREE.ConeGeometry(.35, .7, 4), 0xffe14d), 0, 0, 0); arrow.rotation.x = Math.PI;
let guide = 0, everCollected = false;
function guideTarget() {
  if (S.tut) return null;
  if (guide === 0) { if (player.hand.count) guide = 1; else return stations[0].pos; }
  if (guide === 1) { if (counters.burger.count) guide = 2; else return new V3(SECTIONS.burger, 0, -2.2); }
  if (guide === 2) { if (everCollected) guide = 3; else return moneyPile.count ? PILE : null; }
  if (guide === 3) { if (bought.size) { S.tut = true; dirty = true; } else return new V3(ZONES[0].x, 0, ZONES[0].z); }
  return null;
}

// ---------- loop ----------
let pickT = 0, dropT = 0, cashT = 0, elapsed = 0, passiveT = 0;
const camTarget = new V3(2, 0, -2);
const SQ = Math.SQRT1_2;
function step(dt) {
  elapsed += dt;
  // movimento: joystick em coordenadas de tela -> chão isométrico
  let ix = input.x + ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
  let iy = input.y + ((keys.s || keys.arrowdown) ? 1 : 0) - ((keys.w || keys.arrowup) ? 1 : 0);
  if (AUTO) {
    started = true;
    const t = autoTarget(), p = player.g.position, dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz);
    if (d > .15) { ix = (dx - dz) * SQ / d; iy = (dx + dz) * SQ / d; } // inverso da projeção abaixo
  }
  const il = Math.hypot(ix, iy);
  if (il > 1) { ix /= il; iy /= il; }
  const p = player.g.position;
  if (il > .1) {
    const vx = (ix + iy) * SQ, vz = (-ix + iy) * SQ, sp = speed();
    p.x += vx * sp * dt; p.z += vz * sp * dt;
    turn(player, Math.atan2(vx, vz), dt); player.moving = true;
  } else player.moving = false;
  collide(p); animChar(player, dt);

  // estações
  for (const s of stations) {
    if (s.stack.count < 6 && (s.t += dt) > prepTime(s.type, R.lv.grill)) {
      s.t = 0; const it = makeItem(s.type); s.stack.group.add(it.mesh); it.mesh.position.copy(s.stack.slot(s.stack.count)); s.stack.items.push(it); popIn(it.mesh);
    }
    if (s.type !== 'soda' && (s.smokeT -= dt) <= 0) { s.smokeT = .5 + Math.random() * .4; puff(s.pos.clone().add(new V3((Math.random() - .5) * 1, 1.1, (Math.random() - .5) * .6))); }
    s.max.visible = s.stack.count >= 6;
    if (p.distanceTo(s.pos) < 1.9 && player.hand.count < cap() && (pickT -= dt) <= 0 && transfer(s.stack, player.hand)) { pickT = .12; sfx.pick(); }
  }
  pMax.visible = player.hand.count >= cap();
  for (const t in counters) cMax[t].visible = counters[t].count >= COUNTER_MAX;
  // entregar no balcão (o item de cima vai para a seção dele)
  if (inDrop(p) && canDrop(player.hand) && (dropT -= dt) <= 0 && transfer(player.hand, counters[player.hand.top.type])) { dropT = .08; sfx.drop(); }
  // recolher dinheiro
  if (Math.hypot(p.x - PILE.x, p.z - PILE.z) < 1.3 && (cashT -= dt) <= 0 && moneyPile.ready) {
    cashT = .025; const b = moneyPile.items.pop();
    fly(b, () => player.g.localToWorld(new V3(0, 1, 0)), () => {
      drop(b.mesh); addMoney(b.value); track('earn', b.value); everCollected = true; sfx.coin();
      if (Math.random() < .35) burst(player.g.position.clone().add(new V3(0, 1.3, 0)), 2, COINS, {speed: 1.5, up: 3, life: .5, size: .1});
    }, .18);
  }
  if ((coinT -= dt) <= 0) coinStreak = 0;
  // pagar áreas de compra
  for (const z of ZONES) {
    if (!z.g.visible || bought.has(z.id)) continue;
    if (Math.abs(p.x - z.x) < .95 && Math.abs(p.z - z.z) < .95 && S.money >= .5 && (z.t -= dt) <= 0) {
      z.t = .04; const amt = Math.min(S.money, z.step, z.left); addMoney(-amt); z.left -= amt;
      const b = makeBill(0); b.mesh.position.copy(p).add(new V3(0, 1, 0)); scene.add(b.mesh);
      fly(b, () => new V3(z.x, .05, z.z), () => drop(b.mesh), .2);
      tone(300 + (1 - z.left / z.price) * 600, .04, 'sine', .05);
      const k = 1 - z.left / z.price; z.fill.scale.set(k || .001, k || .001, 1); z.lbl.set('$' + fmt(Math.ceil(z.left)));
      if (z.left <= .001) buyZone(z, true);
    }
  }
  // ajudantes, clientes e renda dos outros restaurantes
  for (const h of helpers) updateHelper(h, dt);
  const interval = Math.max(1.1, 3.2 - seats.length * .17);
  if (queue.length < 4 + Math.floor(seats.length / 4) && (spawnT -= dt) <= 0) { spawnCustomer(); spawnT = interval; }
  for (const c of customers.slice()) updateCustomer(c, dt);
  if ((passiveT += dt) >= 1) {
    passiveT = 0; R.rate = currentRate();
    const others = S.r.reduce((a, r, i) => a + (r && i !== S.cur ? r.rate : 0), 0);
    if (others > 0) addMoney(others / 60, true);
  }

  // animações
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t += dt / f.dur; const k = Math.min(f.t, 1), m = f.item.mesh;
    m.position.lerpVectors(f.start, f.targetFn(), k); m.position.y += Math.sin(k * Math.PI) * 1.2;
    if (f.t >= 1) { flyers.splice(i, 1); f.onArrive(); }
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const o = pops[i]; o.t = Math.min(1, o.t + dt * 3.5); const k = o.t - 1;
    o.obj.scale.setScalar(1 + 2.7 * k * k * k + 1.7 * k * k); // easeOutBack
    if (o.t >= 1) { o.obj.scale.setScalar(1); pops.splice(i, 1); }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt; f.s.position.y += dt * .8; f.s.material.opacity = Math.min(1, 2.2 - f.t);
    if (f.t > 2.2) { scene.remove(f.s); floats.splice(i, 1); }
  }
  updateParts(dt);
  for (const z of ZONES) if (z.g.visible) z.title.position.y = 1.3 + Math.sin(elapsed * 3 + z.x) * .06;
  const gtg = started ? guideTarget() : null;
  arrow.visible = !!gtg;
  if (gtg) { arrow.position.set(gtg.x, 2.3 + Math.abs(Math.sin(elapsed * 4)) * .5, gtg.z); arrow.rotation.y += dt * 2; }
  dropZone.material.opacity = .3 + Math.sin(elapsed * 5) * .15;
  pileMark.material.opacity = moneyPile.count ? .3 + Math.sin(elapsed * 5) * .15 : .12;

  camTarget.lerp(new V3(p.x, 0, p.z), 1 - Math.exp(-dt * 6));
  cam.position.copy(camTarget).add(CAM_OFF); cam.lookAt(camTarget);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt); renderer.render(scene, cam);
  requestAnimationFrame(frame);
}

// ---------- início ----------
for (const z of ZONES) buildZoneUI(z);
for (const z of ZONES) if (bought.has(z.id)) { bought.delete(z.id); buyZone(z, false); }
refreshZones(false); refreshProgress();
ensureDaily();
const away = Date.now() - S.last;
if (firstRun) { loginBonus(); addMoney(0); } else { addMoney(0); showWelcome(FRESH || away < 60000 ? 0 : offlineEarn(away), loginBonus()); }
setInterval(() => { if (ensureDaily()) { toast('📋 Novas missões do dia!'); refreshBadges(); const b = loginBonus(); if (b) showWelcome(0, b); } }, 30000);
requestAnimationFrame(frame);
Cloud.start();
window.__game = {S, R, Cloud, progressOf, migrate, bought, ZONES, stations, customers, helpers, counters, moneyPile, player, get elapsed() { return elapsed; },
  tick(n) { for (let i = 0; i < n; i++) step(1 / 30); renderer.render(scene, cam); }}; // usado nos testes
</script>
</body>
</html>
